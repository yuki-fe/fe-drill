rm 0.6s ease-in-out,opacity 0.6s ease-in-out}.fig-0167[data-step="0"] .e4{transform:translate(0px,0px);opacity:0}.fig-0167[data-step="1"] .e4{transform:translate(0px,0px);opacity:0}.fig-0167[data-step="2"] .e4{transform:translate(0px,0px);opacity:1}.fig-0167[data-step="3"] .e4{transform:translate(0px,0px);opacity:0}.fig-0167 .e5{transform:translate(0px,0px);opacity:1;transition:transform 0.6s ease-in-out,opacity 0.6s ease-in-out}.fig-0167[data-step="0"] .e5{transform:translate(0px,0px);opacity:0}.fig-0167[data-step="1"] .e5{transform:translate(0px,0px);opacity:0}.fig-0167[data-step="2"] .e5{transform:translate(0px,0px);opacity:0}.fig-0167[data-step="3"] .e5{transform:translate(0px,0px);opacity:1}@media (prefers-reduced-motion:reduce){.fig-0167 g{transition:none!important}}</style><defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ink"/></marker><marker id="ar-mark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-mark"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ok"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-blue"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-muted"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-warn"/></marker></defs><rect width="640" height="350" rx="18" class="f-bg"/><text x="40" y="50" text-anchor="start" class="lbl">名前：</text><rect x="110" y="25" width="300" height="40" rx="6" class="f-bg s-line" stroke-width="2"/><text x="40" y="120" text-anchor="start" class="lbl">SQL 文：</text><g class="e0"><text x="122" y="52" text-anchor="start" class="lbl">tanaka</text></g><g class="e1"><text x="122" y="52" text-anchor="start" class="big mono">&#x27; OR &#x27;1&#x27;=&#x27;1</text></g><g class="e2"><text x="40" y="160" text-anchor="start" class="lbl mono">SELECT * FROM 会員 WHERE 名前 = &#x27;tanaka&#x27;</text></g><g class="e3"><text x="40" y="160" text-anchor="start" class="lbl mono">SELECT * FROM 会員 WHERE 名前 = &#x27;&#x27; OR &#x27;1&#x27;=&#x27;1&#x27;</text></g><g class="e4"><text x="320" y="220" text-anchor="middle" class="big">条件がいつも正しい → 全員のデータが出る</text></g><g class="e5"><text x="320" y="220" text-anchor="middle" class="big">プレースホルダ：入力はただの文字として扱う</text><text x="320" y="260" text-anchor="middle" class="lbl">→ SQL 文として動かない</text></g></svg>
