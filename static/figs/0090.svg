ition:transform 0.6s ease-in-out,opacity 0.6s ease-in-out}.fig-0090[data-step="0"] .e6{transform:translate(0px,0px);opacity:0}.fig-0090[data-step="1"] .e6{transform:translate(0px,0px);opacity:0}.fig-0090[data-step="2"] .e6{transform:translate(0px,0px);opacity:0}.fig-0090[data-step="3"] .e6{transform:translate(0px,0px);opacity:1}@media (prefers-reduced-motion:reduce){.fig-0090 g{transition:none!important}}</style><defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ink"/></marker><marker id="ar-mark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-mark"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ok"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-blue"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-muted"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-warn"/></marker></defs><rect width="640" height="350" rx="18" class="f-bg"/><rect x="180" y="110" width="90" height="90" rx="12" class="f-bg s-line" stroke-width="3"/><rect x="290" y="110" width="90" height="90" rx="12" class="f-bg s-line" stroke-width="3"/><rect x="400" y="110" width="90" height="90" rx="12" class="f-bg s-line" stroke-width="3"/><text x="110" y="160" text-anchor="middle" class="lbl">枠</text><g style="transform:translate(190px,120px);opacity:1"><rect x="0" y="0" width="70" height="70" rx="8" class="f-oksoft s-ok" stroke-width="2.5"/><text x="35.0" y